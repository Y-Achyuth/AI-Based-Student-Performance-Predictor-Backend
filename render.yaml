services:
  - type: web
    name: student-performance-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /spp/actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student-performance-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: student-performance-db
    databaseName: student_performance
    user: student_performance_user
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
